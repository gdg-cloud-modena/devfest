baseURL = "https://devfest.modena.it/"
title = "DevFest Modena 2026"

# Language
defaultContentLanguage = "it"
defaultContentLanguageInSubdir = false

# Session times in front matter carry no offset; without this they would be read
# as UTC and published an hour or two off in structured data.
timeZone = "Europe/Rome"

# Output
disableKinds = ["taxonomy"]
disableHugoGeneratorInject = true
enableGitInfo = true
enableRobotsTXT = true

# Markup
ignoreLogs = ['warning-goldmark-raw-html']

[markup]
[markup.goldmark]
[markup.goldmark.renderHooks]
[markup.goldmark.renderHooks.link]
enableDefault = true

[frontmatter]
lastmod = ["lastmod", ":git", "date", "publishDate", ":fileModTime"]

# Custom params

[params]
author = "GDG Cloud Modena"
company = "GDG Cloud Modena"
email = "info@devfest.modena.it"
copyrightFromYear = 2024
favicon = true
simpleAnalyticsDomain = "sa.devfest.modena.it"

# Social share card used by every page that does not set its own `image`.
# Resolved from assets/ and normalised to 1200x630 — see partials/lookup/seo.html.
defaultImage = "images/home-hero.webp"
utm = "utm_source=website&utm_medium=referral&utm_campaign=devfest_modena_2026"
ticketsUrl = "https://gdg.community.dev/e/m6u46s/"
currentEdition = 2026
cvFormUrl = "https://form.asana.com/?k=qpheZ_rD3DLkDmIjsJaKVA&d=588515525965352"
callForSpeakersEnabled = false
sessionizeUrl = "https://sessionize.com/devfest-modena-2026"

# The venue. Lives here rather than in the location page's front matter because
# the Event structured data needs it too (see partials/schema.html).
[params.venue]
name = "Fondazione San Carlo"
street = "Via San Carlo, 5"
city = "Modena"
postalCode = "41121"
region = "MO"
country = "IT"
url = "https://fondazionesancarlo.it"

[params.social]
LinkedIn = "https://www.linkedin.com/showcase/devfest-modena/"
Instagram = "https://www.instagram.com/devfest.modena/"
Facebook = "https://www.facebook.com/events/1308374207349867"
Telegram = "https://t.me/devfest_modena"

# Navigation. Defined once for every language: the labels come from the i18n
# files (keyed by identifier), so adding an entry is a single edit here plus one
# line per language in i18n/.
[menus]
  [[menus.main]]
  identifier = "agenda"
  url = "/2026/agenda/"
  weight = 1

  [[menus.main]]
  identifier = "sessions"
  url = "/2026/sessions/"
  weight = 2

  [[menus.main]]
  identifier = "speakers"
  url = "/2026/speakers/"
  weight = 3

  [[menus.main]]
  identifier = "location"
  url = "/location/"
  weight = 4

  [[menus.main]]
  identifier = "communities"
  url = "/2026/communities/"
  weight = 5

  [[menus.main]]
  identifier = "team"
  url = "/2026/team/"
  weight = 6

  [[menus.main]]
  identifier = "faq"
  url = "/faq/"
  weight = 7

  [[menus.footer]]
  identifier = "wtm"
  name = "Women Techmakers Modena"
  url = "https://wtm.modena.it"
  weight = 1
  [menus.footer.params]
  external = true

# Languages

[languages]
  [languages.it]
    languageCode = "it-IT"
    languageName = "Italiano"
    languageDirection = "ltr"
    title = "DevFest Modena 2026"
    weight = 1
    [languages.it.params]
      brand = "DevFest Modena"
      # Fallback meta description for pages with no description and no body text.
      description = "La più grande conferenza tech dell'Emilia-Romagna: due giorni di talk su AI, Cloud, Web e Mobile, organizzati dalle community locali. Ingresso gratuito."

  [languages.en]
    languageCode = "en-US"
    languageName = "English"
    languageDirection = "ltr"
    title = "DevFest Modena 2026"
    weight = 2
    [languages.en.params]
      brand = "DevFest Modena"
      # Fallback meta description for pages with no description and no body text.
      description = "The largest tech conference in Emilia-Romagna: two days of talks on AI, Cloud, Web and Mobile, run by the local developer communities. Free entry."
