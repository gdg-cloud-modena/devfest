baseURL = "https://devfest.modena.it/"
title = "DevFest Modena 2026"

# Language
defaultContentLanguage = "it"
languageCode = "it-IT"

# Output
disableKinds = ["taxonomy"]
disableHugoGeneratorInject = true
enableGitInfo = true
enableRobotsTXT = true

# Markup
ignoreLogs = ['warning-goldmark-raw-html']

[markup]
[markup.goldmark]
[markup.goldmark.renderHooks]
[markup.goldmark.renderHooks.link]
enableDefault = true

[frontmatter]
lastmod = ["lastmod", ":git", "date", "publishDate", ":fileModTime"]

# Custom params

[params]
author = "GDG Cloud Modena"
company = "GDG Cloud Modena"
email = "info@devfest.modena.it"
subject = "evento, event, tech, stem, devfest"
copyrightFromYear = 2024
favicon = true
hidden = false
simpleAnalyticsDomain = "sa.devfest.modena.it"
utm = "utm_source=website&utm_medium=referral&utm_campaign=devfest_modena_2026"
ticketsUrl = "https://gdg.community.dev/e/m6u46s/"
currentEdition = 2026
cvFormUrl = "https://form.asana.com/?k=qpheZ_rD3DLkDmIjsJaKVA&d=588515525965352"
callForSpeakersEnabled = false
sessionizeUrl = "https://sessionize.com/devfest-modena-2026"

[params.social]
LinkedIn = "https://www.linkedin.com/showcase/devfest-modena/"
Instagram = "https://www.instagram.com/devfest.modena/"
Facebook = "https://www.facebook.com/events/1308374207349867"
Telegram = "https://t.me/devfest_modena"

# Memu

[menus]

