name = "Speaker"
url = "/2026/speakers/"
weight = 3

[[menus.main]]
identifier = "location"
name = "Location"
url = "/location/"
weight = 4

[[menus.main]]
identifier = "communities"
name = "Community"
url = "/2026/communities/"
weight = 5

[[menus.main]]
identifier = "team"
name = "Team"
url = "/2026/team/"
