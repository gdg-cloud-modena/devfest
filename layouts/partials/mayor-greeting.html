<section class="section section--padded mayorGreeting">
  <div class="mayorGreeting-container">
    <blockquote class="mayorGreeting-card">
      <div class="mayorGreeting-header">
        <span class="mayorGreeting-tag">🏛️ {{ i18n "mayorGreetingTag" }}</span>
      </div>
      <div class="mayorGreeting-body">
        <svg class="mayorGreeting-quoteIcon" width="36" height="36" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M14.017 21v-7.391c0-5.704 3.731-9.57 8.983-10.609l.995 2.151c-2.432.917-3.995 3.638-3.995 5.849h4v10h-9.983zm-14.017 0v-7.391c0-5.704 3.748-9.57 9-10.609l.996 2.151c-2.433.917-3.996 3.638-3.996 5.849h3.983v10h-9.983z"/>
        </svg>
        <p class="mayorGreeting-text">
          &laquo;{{ i18n "mayorGreetingText" }}&raquo;
        </p>
      </div>
      <footer class="mayorGreeting-footer">
        <cite class="mayorGreeting-author">
          <strong class="mayorGreeting-name">{{ i18n "mayorGreetingAuthor" }}</strong>
          <span class="mayorGreeting-role">{{ i18n "mayorGreetingRole" }}</span>
        </cite>
      </footer>
    </blockquote>
  </div>
</section>
