{{ $currentEdition := printf "%v" .Site.Params.currentEdition }}
{{ $pageEdition := .Param "year" }}
{{ if and $pageEdition (ne $currentEdition (printf "%v" $pageEdition)) }}
<p class="callout callout--warning" role="status" aria-live="polite">{{ printf (i18n "prevEditionCallout") (printf "%v" $pageEdition) }}</p>
{{ end }}
